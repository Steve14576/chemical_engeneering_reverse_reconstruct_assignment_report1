<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780"><rect width="1240" height="780" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><text x="20" y="30" font-size="16" fill="#111">图7  我们到底干了什么（说人话版工作总览）</text><text x="20" y="68" font-size="14" fill="#111">① 现场拿到的东西，先记清楚</text><rect x="20" y="82" width="210" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="125.0" y="105.0" font-size="12" text-anchor="middle" fill="#111">两张现场手绘图</text><text x="125.0" y="120.0" font-size="12" text-anchor="middle" fill="#111">歪、缺线、有假管断管</text><text x="125.0" y="135.0" font-size="12" text-anchor="middle" fill="#111">只有1.5小时、没图纸</text><rect x="260" y="82" width="180" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="350.0" y="105.0" font-size="12" text-anchor="middle" fill="#111">把图抄成表格</text><text x="350.0" y="120.0" font-size="12" text-anchor="middle" fill="#111">设备/连线/看不清的</text><text x="350.0" y="135.0" font-size="12" text-anchor="middle" fill="#111">分开记，不改原图</text><rect x="470" y="82" width="190" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="565.0" y="105.0" font-size="12" text-anchor="middle" fill="#111">两人表格拼一起</text><text x="565.0" y="120.0" font-size="12" text-anchor="middle" fill="#111">发现：各画各的</text><text x="565.0" y="135.0" font-size="12" text-anchor="middle" fill="#111">连线几乎不重叠</text><line x1="230" y1="119" x2="260" y2="119" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><line x1="440" y1="119" x2="470" y2="119" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="20" y="196" font-size="14" fill="#111">② 检查图对不对，再补缺口</text><rect x="20" y="210" width="200" height="84" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="120.0" y="238.0" font-size="12" text-anchor="middle" fill="#111">用硬规矩查图：</text><text x="120.0" y="253.0" font-size="12" text-anchor="middle" fill="#111">每台设备必须有进有出</text><text x="120.0" y="268.0" font-size="12" text-anchor="middle" fill="#111">→ 查不通，缺约17条线</text><rect x="250" y="210" width="180" height="84" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="340.0" y="238.0" font-size="12" text-anchor="middle" fill="#111">承认有没画出来的线</text><text x="340.0" y="253.0" font-size="12" text-anchor="middle" fill="#111">→ 能通了</text><text x="340.0" y="268.0" font-size="12" text-anchor="middle" fill="#111">并算出缺哪17条</text><rect x="460" y="210" width="190" height="84" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="555.0" y="238.0" font-size="12" text-anchor="middle" fill="#111">承认有画错的线</text><text x="555.0" y="253.0" font-size="12" text-anchor="middle" fill="#111">→ 40条现场线都自洽</text><text x="555.0" y="268.0" font-size="12" text-anchor="middle" fill="#111">剩3处选择题</text><rect x="680" y="210" width="200" height="84" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="780.0" y="238.0" font-size="12" text-anchor="middle" fill="#111">按书上标准MTBE流程：</text><text x="780.0" y="253.0" font-size="12" text-anchor="middle" fill="#111">做3处选择+最少补7条线</text><text x="780.0" y="268.0" font-size="12" text-anchor="middle" fill="#111">验证过没有更少的补法</text><line x1="220" y1="252" x2="250" y2="252" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="201.0" y="248.0" font-size="11" fill="#666">加没画变量</text><line x1="430" y1="252" x2="460" y2="252" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="411.0" y="248.0" font-size="11" fill="#666">加画错变量</text><line x1="650" y1="252" x2="680" y2="252" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="631.0" y="248.0" font-size="11" fill="#666">书上标准+枚举</text><text x="20" y="334" font-size="14" fill="#111">③ 算账验证</text><rect x="20" y="348" width="240" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="140.0" y="371.0" font-size="12" text-anchor="middle" fill="#111">物料对账：进=出</text><text x="140.0" y="386.0" font-size="12" text-anchor="middle" fill="#111">MTBE 约 2.09 t/h</text><text x="140.0" y="401.0" font-size="12" text-anchor="middle" fill="#111">（只证明自洽，不证明全真）</text><rect x="300" y="348" width="300" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="450.0" y="371.0" font-size="12" text-anchor="middle" fill="#111">热负荷粗算 约1221 kW</text><text x="450.0" y="386.0" font-size="12" text-anchor="middle" fill="#111">换参数看结果变多少</text><text x="450.0" y="401.0" font-size="12" text-anchor="middle" fill="#111">逐条抽掉线看结论翻不翻</text><line x1="260" y1="385" x2="300" y2="385" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><line x1="560" y1="294" x2="560" y2="348" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="526.0" y="317.0" font-size="11" fill="#666">流程定稿后</text><text x="20" y="462" font-size="14" fill="#111">④ 交给老师什么</text><rect x="20" y="476" width="230" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="135.0" y="499.0" font-size="12" text-anchor="middle" fill="#111">流程图/框图/结构图</text><text x="135.0" y="514.0" font-size="12" text-anchor="middle" fill="#111">每种线标明来源：</text><text x="135.0" y="529.0" font-size="12" text-anchor="middle" fill="#111">实=现场 虚=书上补 叉=不确定</text><rect x="280" y="476" width="200" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="380.0" y="499.0" font-size="12" text-anchor="middle" fill="#111">报告正文</text><text x="380.0" y="514.0" font-size="12" text-anchor="middle" fill="#111">每句话标：看到的/</text><text x="380.0" y="529.0" font-size="12" text-anchor="middle" fill="#111">书上查的/我们推的</text><rect x="510" y="476" width="200" height="74" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="610.0" y="499.0" font-size="12" text-anchor="middle" fill="#111">电子附件</text><text x="610.0" y="514.0" font-size="12" text-anchor="middle" fill="#111">脚本+数据，可复跑</text><text x="610.0" y="529.0" font-size="12" text-anchor="middle" fill="#111">改过什么主意都记了</text><line x1="140" y1="422" x2="120" y2="476" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><line x1="450" y1="422" x2="380" y2="476" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><rect x="920" y="82" width="300" height="120" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1070.0" y="114.0" font-size="12" text-anchor="middle" fill="#111">补线的规矩</text><text x="1070.0" y="129.0" font-size="12" text-anchor="middle" fill="#111">不是想补就补：</text><text x="1070.0" y="144.0" font-size="12" text-anchor="middle" fill="#111">只在标准流程可能有的线里选</text><text x="1070.0" y="159.0" font-size="12" text-anchor="middle" fill="#111">补最少条数且验证唯一</text><text x="1070.0" y="174.0" font-size="12" text-anchor="middle" fill="#111">补的线在图上画虚线</text><rect x="920" y="226" width="300" height="110" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1070.0" y="260.0" font-size="12" text-anchor="middle" fill="#111">说话的规矩</text><text x="1070.0" y="275.0" font-size="12" text-anchor="middle" fill="#111">书上有据 → 写出处</text><text x="1070.0" y="290.0" font-size="12" text-anchor="middle" fill="#111">没据 → 标推断</text><text x="1070.0" y="305.0" font-size="12" text-anchor="middle" fill="#111">看不清 → 写未知，不编</text><rect x="920" y="360" width="300" height="110" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="1070.0" y="394.0" font-size="12" text-anchor="middle" fill="#111">查账的规矩</text><text x="1070.0" y="409.0" font-size="12" text-anchor="middle" fill="#111">每步有记录、有哈希</text><text x="1070.0" y="424.0" font-size="12" text-anchor="middle" fill="#111">改主意记在流水里</text><text x="1070.0" y="439.0" font-size="12" text-anchor="middle" fill="#111">成绩前私有，成绩后公开</text><line x1="660" y1="119" x2="920" y2="119" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><line x1="880" y1="252" x2="920" y2="280" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><line x1="710" y1="513" x2="920" y2="415" stroke="#111" stroke-width="1.8" marker-end="url(#ar)"/><text x="20" y="580" font-size="13" fill="#111">一句话：两张不准的手绘图 → 查出错在哪、缺多少 → 按书上标准补缺口并标明 → 算账验证 → 交给老师。</text><text x="20" y="602" font-size="12" fill="#666">侧栏是三条纪律：补线规矩（怎么补）、说话规矩（怎么写字）、查账规矩（怎么复核）。</text></svg>