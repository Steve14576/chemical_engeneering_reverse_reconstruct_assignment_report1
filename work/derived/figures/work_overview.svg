<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860"><rect width="1240" height="860" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker></defs><text x="20" y="30" font-size="16" fill="#111">图6  本报告的工作总览与模型架构（Our Work）</text><text x="20" y="70" font-size="14" fill="#111">① 数据与冻结</text><rect x="20" y="85" width="200" height="70" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="120.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">现场记录 ×2</text><text x="120.0" y="121.0" font-size="12" text-anchor="middle" fill="#111">person1 照片+重画(无向声明)</text><text x="120.0" y="136.0" font-size="12" text-anchor="middle" fill="#111">person2 电子草图 | 1.5h/无图/假管</text><rect x="250" y="85" width="150" height="70" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="325.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">冻结 + SHA256</text><text x="325.0" y="121.0" font-size="12" text-anchor="middle" fill="#111">处理登记台账</text><text x="325.0" y="136.0" font-size="12" text-anchor="middle" fill="#111">未登记=未发生</text><rect x="430" y="85" width="170" height="70" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="515.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">L1 机械解析</text><text x="515.0" y="121.0" font-size="12" text-anchor="middle" fill="#111">节点/边/几何/介质标签</text><text x="515.0" y="136.0" font-size="12" text-anchor="middle" fill="#111">不裁决不脑补</text><rect x="630" y="85" width="190" height="70" fill="#fff" stroke="#111" stroke-width="1.6"/><text x="725.0" y="106.0" font-size="12" text-anchor="middle" fill="#111">L2 位号对齐合并</text><text x="725.0" y="121.0" font-size="12" text-anchor="middle" fill="#111">发现: 两人连线零重叠</text><text x="725.0" y="136.0" font-size="12" text-anchor="middle" fill="#111">重号/缺号/未知 登记为假设</text><line x1="220" y1="120" x2="250" y2="120" stroke="#111" stroke-width="1.8" marker-end="ur