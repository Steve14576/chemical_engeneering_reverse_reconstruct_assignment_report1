# 先验背书档（D11）：每条 prior 的出处强度（Q3 四档）
# 规则：档0 不需背书；档1 单元惯例=化工原理精馏章；档2 工艺序列=MTBE 文献；档3 设备内件=设备章/专利/论文图。
# 未命中者标 status: 未直接命中 → 降级为"推断"并进报告局限清单。
meta:
  level: P4-backing
  date: 2026-09-04
  search_note: WebSearch 两轮（MTBE 工艺序列 / 催化蒸馏塔内件）；仅记录命中摘要与 URL，未全文核实处标"摘要级"。

derivation:   # 怎么推的（检索→判定→降级 的完整链）
  queries:
    - "MTBE 装置 工艺流程 醚化反应器 催化蒸馏塔 甲醇萃取塔 甲醇回收塔 流程叙述"
    - "催化蒸馏塔 结构 内件 催化剂捆包 MTBE 反应精馏 塔段"
  hit_rule: 摘要中**直接出现所 claim 的单元关系/结构/序列**才算命中；仅出现设备名而无关系不算命中
  tier2_front_why_hit: 知乎专栏给出"混相反应段预反应(转化率90–95%)→催化蒸馏"序列；acad-pub PDF 给出"甲醇与C4混合进反应器 / 甲醇注入催化蒸馏塔反应段"；流程工业给出原料(混合C4异丁烯+甲醇)与酸性催化剂；CN113952904B 旁证"醚后碳四输送泵"单元存在
  tier2_back_why_miss: 两轮摘要均未出现"醚后C4→甲醇萃取塔→甲醇回收塔"的序列表述 → 未命中 → 降级"档2-弱·推断"。注意区分：两塔**存在**有 person2 name_zh 观测背书；缺的只是"它在序列里排哪"的文献背书
  tier3_internals_why_hit: CN201037131Y(内件换捆包催化剂)、CN102824752A(反应段/分离段相间)、丹东立和(上精馏/中反应/下提馏三段) 直接描述结构
  tier3_others_why_defer: 未检索——按 Q3 收集顺序先由 user 翻速通手册（泵/换热讲已有图），避免重复劳动与无谓网络依赖
  limitation: 全部摘要级命中、未全文核实；报告引用标"摘要级"；未命中项进报告局限清单

